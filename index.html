  <body><style>
#rnova-splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
background:radial-gradient(120% 80% at 50% 0%,#8f6bff 0%,#5b3df5 45%,#2f2a8f 100%);color:#fff;
font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:opacity .35s ease;padding:24px;text-align:center}
#rnova-splash.hide{opacity:0;pointer-events:none}
#rnova-splash img{width:150px;height:auto;animation:rnova-bob 1.1s ease-in-out infinite;filter:drop-shadow(0 10px 18px rgba(20,10,60,.45))}
#rnova-splash .t{font-size:30px;font-weight:900;letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.18)}
#rnova-splash .m{font-size:16px;font-weight:700;opacity:.95;min-height:22px}
#rnova-splash .bar{width:min(240px,70vw);height:10px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
#rnova-splash .bar i{display:block;height:100%;width:40%;border-radius:99px;background:linear-gradient(90deg,#ffd84d,#ff8ac2);animation:rnova-slide 1.2s ease-in-out infinite}
#rnova-splash .dots i{display:inline-block;width:8px;height:8px;margin:0 4px;border-radius:50%;background:#fff;animation:rnova-dot 1s ease-in-out infinite}
#rnova-splash .dots i:nth-child(2){animation-delay:.15s}#rnova-splash .dots i:nth-child(3){animation-delay:.3s}
@keyframes rnova-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(2deg)}}
@keyframes rnova-slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes rnova-dot{0%,100%{transform:translateY(0);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
@media (prefers-reduced-motion:reduce){#rnova-splash *{animation:none!important}}
</style>
<div id="rnova-splash" role="status" aria-live="polite">
<img src="/rnova/splash-jazel.png" alt=""/>
<div class="t">RNOVA</div>
<div class="bar"><i></i></div>
<div class="m" id="rnova-splash-msg">Getting your study space ready…</div>
<div class="dots"><i></i><i></i><i></i></div>
</div>
<script>
(function(){
  var el=document.getElementById('rnova-splash'),msg=document.getElementById('rnova-splash-msg');
  try{if(sessionStorage.getItem('rnova:updating')){msg.textContent='Updating to the newest version…';sessionStorage.removeItem('rnova:updating');}}catch(e){}
  window.__rnovaHideSplash=function(){el.classList.add('hide');setTimeout(function(){el.style.display='none';},400);};
  window.__rnovaShowSplash=function(text){if(text)msg.textContent=text;el.style.display='flex';el.classList.remove('hide');};
  setTimeout(window.__rnovaHideSplash,20000);
})();
</script>
